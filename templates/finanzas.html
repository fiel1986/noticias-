<!DOCTYPE html>
<html lang="es">
<head>
   <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon.ico') }}">
    <title>Finanzas</title>
    
    <style type="text/css">
        :root {
            --background-color: #0a0a0a;
            --text-color: #ffffff;
            --primary-color: #2563eb;
            --secondary-color: #7c3aed;
            --accent-color: #06d6a0;
            --card-bg: rgba(30, 30, 30, 0.8);
            --border-color: #374151;
        }

        .light-mode {
            --background-color: #f8fafc;
            --text-color: #1f2937;
            --primary-color: #3b82f6;
            --secondary-color: #8b5cf6;
            --accent-color: #10b981;
            --card-bg: rgba(255, 255, 255, 0.9);
            --border-color: #d1d5db;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--background-color);
            color: var(--text-color);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            transition: all 0.5s ease;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-radius: 20px;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?w=1200') center/cover;
            opacity: 0.1;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #fff, #e0e7ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
            position: relative;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .converter-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-color);
        }

        select, input {
            padding: 15px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background: var(--card-bg);
            color: var(--text-color);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.3);
        }

        .btn-secondary {
            background: var(--card-bg);
            color: var(--text-color);
            border: 2px solid var(--border-color);
        }

        .btn-secondary:hover {
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }

        .result-card {
            background: linear-gradient(135deg, var(--accent-color), #059669);
            color: white;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            margin-top: 20px;
            display: none;
        }

        .result-card.visible {
            display: block;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .rates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .rate-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .rate-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-color);
        }

        .rate-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-color);
            margin: 10px 0;
        }

        .news-section {
            grid-column: 1 / -1;
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .news-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .news-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-color);
        }

        .news-title {
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .news-source {
            font-size: 0.9rem;
            color: var(--accent-color);
            margin-top: 10px;
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .theme-btn {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            color: var(--text-color);
            padding: 12px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.2rem;
        }

        .theme-btn:hover {
            transform: rotate(180deg);
            border-color: var(--primary-color);
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 8s infinite;
        }

        .light-mode .star {
            background: #666;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .container {
                padding: 10px;
            }
            
            .card {
                padding: 20px;
            }
        }
        .nav-links {
    display: flex;
    gap: 15px;
    justify-content: center;
    margin: 30px 0;
    flex-wrap: wrap;
}

.nav-links a {
    background: rgba(255, 255, 255, 0.1);
    color: white;
    padding: 14px 28px;
    text-decoration: none;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(10px);
    transition: all 0.3s ease;
    font-weight: 600;
    text-align: center;
    min-width: 140px;
    font-size: 1rem;
}

.nav-links a:hover {
    background: rgba(255, 255, 255, 0.2);
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
    border-color: rgba(255, 255, 255, 0.3);
}

.nav-links a.active {
    background: rgba(0, 123, 255, 0.3);
    border-color: rgba(0, 123, 255, 0.5);
}

#theme-toggle {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 24px; 
    color: #ffd700;
    transition: color 0.3s ease;
}

#theme-toggle:hover {
    color: #fff; 
}
    </style>
</head>

<body>
    <div class="stars" id="stars"></div>
    
    <div class="theme-toggle">
        <button class="theme-btn" id="themeToggle">🌙</button>
    </div>

    <div class="container">
        <header class="header">
            <h1> FINANZAS </h1>
            <p>Conversor de Divisas • Tasas en Tiempo Real • Noticias Financieras</p>
        </header>
        
    
             <nav class="nav-links">
                <a href="{{ url_for('home') }}"> Inicio</a>
                <a href="{{ url_for('contacto') }}"> Contacto</a>
            </nav>
        

        <div class="main-grid">
            <div class="card">
                <h2>Conversor de Divisas</h2>
                <form id="currencyForm" class="converter-form">
                    <div class="input-group">
                        <label for="amount">Monto a Convertir</label>
                        <input type="number" id="amount" placeholder="100" min="0" step="0.01" required>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1fr auto 1fr; gap: 15px; align-items: end;">
                        <div class="input-group">
                            <label for="fromCurrency">De</label>
                            <select id="fromCurrency" required>
                                <option value="">Seleccionar...</option>
                            </select>
                        </div>
                        
                        <button type="button" class="btn btn-secondary" id="swapCurrencies" style="padding: 12px; border-radius: 50%;">⇄</button>
                        
                        <div class="input-group">
                            <label for="toCurrency">A</label>
                            <select id="toCurrency" required>
                                <option value="">Seleccionar...</option>
                            </select>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">
                        Convertir
                    </button>
                </form>

                <div id="result" class="result-card">
                    <div id="resultText"></div>
                </div>
            </div>

            <div class="card">
                <h2>Tasas Principales</h2>
                <div class="rates-grid" id="majorRates">
                    <div class="spinner"></div>
                </div>
                <button class="btn btn-secondary" id="showAllRates" style="margin-top: 20px; width: 100%;">
                    Ver Todas las Tasas
                </button>
            </div>

            <div class="card" id="allRatesSection" style="display: none;">
                <h2>Todas las Tasas de Cambio</h2>
                <div id="allRates" style="max-height: 400px; overflow-y: auto;"></div>
            </div>

            <div class="card news-section">
                <h2>Últimas Noticias Financieras</h2>
                <div class="news-grid" id="newsContainer">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>
    </div>

          <script>
      document.addEventListener('DOMContentLoaded', function() {
        // Elementos del DOM (Ahora definidos correctamente en el alcance correcto)
        const elements = {
            themeToggle: document.getElementById('themeToggle'),
            currencyForm: document.getElementById('currencyForm'),
            fromCurrency: document.getElementById('fromCurrency'),
            toCurrency: document.getElementById('toCurrency'),
            amount: document.getElementById('amount'),
            result: document.getElementById('result'),
            resultText: document.getElementById('resultText'),
            majorRates: document.getElementById('majorRates'),
            showAllRates: document.getElementById('showAllRates'),
            allRatesSection: document.getElementById('allRatesSection'),
            allRates: document.getElementById('allRates'),
            newsContainer: document.getElementById('newsContainer'),
            swapCurrencies: document.getElementById('swapCurrencies')
        };

        const majorCurrencies = ['USD', 'EUR', 'GBP', 'JPY', 'CAD', 'AUD', 'CHF', 'CNY', 'MXN'];

        initializeApp();
        createStars();

        // Funciones locales accesibles dentro de este scope
        async function initializeApp() {
            await loadCurrencies();
            await loadMajorRates();
            await loadFinancialNews();
            setupEventListeners();
        }

        function setupEventListeners() {
            if (elements.themeToggle) {
                elements.themeToggle.addEventListener('click', toggleTheme);
            }
            
            if (elements.currencyForm) {
                elements.currencyForm.addEventListener('submit', handleConversion);
            }
            
            if (elements.showAllRates) {
                elements.showAllRates.addEventListener('click', toggleAllRates);
            }
            
            if (elements.swapCurrencies) {
                elements.swapCurrencies.addEventListener('click', swapCurrencies);
            }
        }

        async function loadCurrencies() {
            try {
                let currencies = ['USD', 'EUR', 'GBP', 'JPY', 'CAD', 'AUD', 'CHF', 'CNY', 'MXN', 'BRL', 'ARS'];
                
                try {
                    const response = await fetch('/api/moneda?list=true');
                    if (response.ok) {
                        const data = await response.json();
                        if (data.currencies && Array.isArray(data.currencies)) {
                            currencies = data.currencies;
                        }
                    }
                } catch (e) {
                    console.log('No se pudo obtener lista de monedas, usando lista por defecto');
                }

                const fromSelect = document.getElementById('fromCurrency');
                const toSelect = document.getElementById('toCurrency');
                
                if (!fromSelect || !toSelect) return;

                fromSelect.innerHTML = '';
                toSelect.innerHTML = '';

                currencies.forEach(currency => {
                    const option = new Option(currency, currency);
                    fromSelect.add(option.cloneNode(true));
                    toSelect.add(option);
                });

                fromSelect.value = 'EUR';
                toSelect.value = 'USD';

            } catch (error) {
                console.error('Error loading currencies:', error);
                showError('Error al cargar las monedas');
            }
        }

        async function handleConversion(event) {
            event.preventDefault();
            
            const fromCurrency = document.getElementById('fromCurrency').value;
            const toCurrency = document.getElementById('toCurrency').value;
            const amount = parseFloat(document.getElementById('amount').value);

            if (!fromCurrency || !toCurrency || isNaN(amount)) {
                showError('Por favor completa todos los campos');
                return;
            }

            try {
                document.getElementById('resultText').innerHTML = '<div class="spinner"></div>';
                document.getElementById('result').classList.add('visible');

                const url = `/api/moneda?from=${fromCurrency}&to=${toCurrency}&amount=${amount}`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.status === 'success' && data.result !== undefined) {
                    const result = data.result;
                    const rate = data.rate || (result / amount);

                    document.getElementById('resultText').innerHTML = `
                        <div style="font-size: 0.9em; margin-bottom: 10px;">💱 ${fromCurrency} → ${toCurrency}</div>
                        <div style="font-size: 2rem; font-weight: bold; margin: 10px 0;">
                            ${amount} ${fromCurrency} = ${result.toFixed(2)} ${toCurrency}
                        </div>
                        <div style="font-size: 0.9em; color: rgba(255,255,255,0.8);">
                            Tasa: 1 ${fromCurrency} = ${rate.toFixed(6)} ${toCurrency}
                        </div>
                    `;
                } else {
                    throw new Error(data.error || 'Error en la conversión');
                }

            } catch (error) {
                console.error('Error en conversión:', error);
                showError('Error en la conversión: ' + error.message);
            }
        }

        async function loadMajorRates() {
            try {
                // Usamos tasas demo ya que la API /api/moneda no devuelve todas las tasas juntas
                const tasasDemo = {
                    'USD': 1.08, 'EUR': 1.0, 'GBP': 0.85, 'JPY': 160.5, 'CAD': 1.47,
                    'AUD': 1.65, 'CHF': 0.96, 'CNY': 7.85, 'MXN': 18.5, 'BRL': 5.4
                };

                elements.majorRates.innerHTML = majorCurrencies.map(currency => `
                    <div class="rate-card">
                        <div>${getCurrencyFlag(currency)} ${currency}</div>
                        <div class="rate-value">${tasasDemo[currency] ? tasasDemo[currency].toFixed(4) : 'N/A'}</div>
                        <div style="font-size: 0.8em;">vs EUR</div>
                    </div>
                `).join('');

            } catch (error) {
                console.error('Error en loadMajorRates:', error);
                elements.majorRates.innerHTML = '<div class="error">Error cargando tasas</div>';
            }
        }

        async function toggleAllRates() {
            if (elements.allRatesSection.style.display === 'none') {
                await loadAllRates();
                elements.allRatesSection.style.display = 'block';
                elements.showAllRates.textContent = '📉 Ocultar Tasas';
            } else {
                elements.allRatesSection.style.display = 'none';
                elements.showAllRates.textContent = '📈 Ver Todas las Tasas';
            }
        }

        async function loadAllRates() {
            try {
                const tasasDemo = {
                    'USD': 1.08, 'EUR': 1.0, 'GBP': 0.85, 'JPY': 160.5, 'CAD': 1.47,
                    'AUD': 1.65, 'CHF': 0.96, 'CNY': 7.85, 'MXN': 18.5, 'BRL': 5.4,
                    'ARS': 950.0, 'RUB': 92.0, 'INR': 89.5, 'COP': 4200.0, 'CLP': 980.0
                };

                const ratesList = Object.entries(tasasDemo)
                    .sort(([a], [b]) => a.localeCompare(b))
                    .map(([currency, rate]) => `
                        <div style="display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid var(--border-color);">
                            <span>${getCurrencyFlag(currency)} ${currency}</span>
                            <span style="font-weight: bold;">${rate.toFixed(6)}</span>
                        </div>
                    `).join('');

                elements.allRates.innerHTML = ratesList;
            } catch (error) {
                elements.allRates.innerHTML = '<div class="error">Error cargando todas las tasas</div>';
            }
        }

        async function loadFinancialNews() {
            try {
                const response = await fetch('/api/gnews?category=finance&country=mx');
                const data = await response.json();

                if (data.status === 'success' && data.articles && data.articles.length > 0) {
                    elements.newsContainer.innerHTML = data.articles.map(article => `
                        <div class="news-card" onclick="window.open('${article.url}', '_blank')" style="cursor: pointer;">
                            <div class="news-title">${article.title}</div>
                            <div style="font-size: 0.9em; opacity: 0.8; margin-top: 10px;">
                                ${article.description || 'Sin descripción'}
                            </div>
                            <div class="news-source">${article.source.name} • ${new Date(article.publishedAt).toLocaleDateString()}</div>
                        </div>
                    `).join('');
                } else {
                    elements.newsContainer.innerHTML = `
                        <div class="news-card">
                            <div class="news-title">Noticias de Mercados</div>
                            <div style="font-size: 0.9em; opacity: 0.8;">
                                No hay noticias financieras disponibles en este momento.
                            </div>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error noticias financieras:', error);
                elements.newsContainer.innerHTML = `
                    <div class="news-card">
                        <div class="news-title">💼 Mercados Globales</div>
                        <div style="font-size: 0.9em; opacity: 0.8;">
                            Error cargando noticias. Intenta más tarde.
                        </div>
                    </div>
                `;
            }
        }

        function swapCurrencies() {
            const fromSelect = document.getElementById('fromCurrency');
            const toSelect = document.getElementById('toCurrency');
            
            const temp = fromSelect.value;
            fromSelect.value = toSelect.value;
            toSelect.value = temp;
            
            if (document.getElementById('result').classList.contains('visible')) {
                document.getElementById('currencyForm').dispatchEvent(new Event('submit'));
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const btn = document.getElementById('themeToggle');
            if (btn) {
                btn.textContent = document.body.classList.contains('light-mode') ? '🌞' : '🌙';
            }
        }

        function getCurrencyFlag(currency) {
            const flags = {
                'USD': '🇺🇸', 'EUR': '🇪🇺', 'GBP': '🇬🇧', 'JPY': '🇯🇵',
                'CAD': '🇨🇦', 'AUD': '🇦🇺', 'CHF': '🇨🇭', 'CNY': '🇨🇳',
                'MXN': '🇲🇽', 'BRL': '🇧🇷', 'ARS': '🇦🇷', 'RUB': '🇷🇺'
            };
            return flags[currency] || '💱';
        }

        function showError(message) {
            const resultText = document.getElementById('resultText');
            if (resultText) {
                resultText.innerHTML = `<div style="color: #ff6b6b;">❌ ${message}</div>`;
            }
            const result = document.getElementById('result');
            if (result) result.classList.add('visible');
        }

        function createStars() {
            const starContainer = document.getElementById('stars');
            if (!starContainer) return;

            const starCount = 200;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                const x = Math.random() * window.innerWidth;
                const y = Math.random() * window.innerHeight;
                const scale = Math.random() * 2;
                const duration = 5 + Math.random() * 10;
                
                star.style.cssText = `
                    position: absolute;
                    left: ${x}px;
                    top: ${y}px;
                    transform: scale(${scale});
                    animation: twinkle ${duration}s infinite;
                    background: white;
                    width: 2px;
                    height: 2px;
                    border-radius: 50%;
                    opacity: ${Math.random()};
                `;
                
                starContainer.appendChild(star);
            }
        }
      });
    </script>
</body>
</html>
