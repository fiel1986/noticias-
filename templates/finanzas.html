<!DOCTYPE html>
<html lang="es">
<head>
   <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicons/favicon-16x16.png') }}">
    <title>Finanzas - Conversor de Divisas</title>
    
    <style type="text/css">
        :root {
            --background-color: #0a0a0a;
            --text-color: #ffffff;
            --primary-color: #2563eb;
            --secondary-color: #7c3aed;
            --accent-color: #06d6a0;
            --card-bg: rgba(30, 30, 30, 0.8);
            --border-color: #374151;
        }

        .light-mode {
            --background-color: #f8fafc;
            --text-color: #1f2937;
            --primary-color: #3b82f6;
            --secondary-color: #8b5cf6;
            --accent-color: #10b981;
            --card-bg: rgba(255, 255, 255, 0.9);
            --border-color: #d1d5db;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--background-color);
            color: var(--text-color);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            transition: all 0.5s ease;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-radius: 20px;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?w=1200') center/cover;
            opacity: 0.1;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #fff, #e0e7ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
            position: relative;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .converter-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-color);
        }

        select, input {
            padding: 15px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background: var(--card-bg);
            color: var(--text-color);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.3);
        }

        .btn-secondary {
            background: var(--card-bg);
            color: var(--text-color);
            border: 2px solid var(--border-color);
        }

        .btn-secondary:hover {
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }

        .result-card {
            background: linear-gradient(135deg, var(--accent-color), #059669);
            color: white;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            margin-top: 20px;
            display: none;
        }

        .result-card.visible {
            display: block;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .rates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .rate-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .rate-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-color);
        }

        .rate-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-color);
            margin: 10px 0;
        }

        .news-section {
            grid-column: 1 / -1;
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .news-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .news-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-color);
        }

        .news-title {
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .news-source {
            font-size: 0.9rem;
            color: var(--accent-color);
            margin-top: 10px;
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .theme-btn {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            color: var(--text-color);
            padding: 12px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.2rem;
        }

        .theme-btn:hover {
            transform: rotate(180deg);
            border-color: var(--primary-color);
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 8s infinite;
        }

        .light-mode .star {
            background: #666;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .container {
                padding: 10px;
            }
            
            .card {
                padding: 20px;
            }
        }
        .nav-links {
    display: flex;
    gap: 15px;
    justify-content: center;
    margin: 30px 0;
    flex-wrap: wrap;
}

.nav-links a {
    background: rgba(255, 255, 255, 0.1);
    color: white;
    padding: 14px 28px;
    text-decoration: none;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(10px);
    transition: all 0.3s ease;
    font-weight: 600;
    text-align: center;
    min-width: 140px;
    font-size: 1rem;
}

.nav-links a:hover {
    background: rgba(255, 255, 255, 0.2);
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
    border-color: rgba(255, 255, 255, 0.3);
}

.nav-links a.active {
    background: rgba(0, 123, 255, 0.3);
    border-color: rgba(0, 123, 255, 0.5);
}

/* Estilo para el botón de cambio de tema */
#theme-toggle {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 24px; /* Tamaño del icono */
    color: #ffd700; /* Color dorado para el sol */
    transition: color 0.3s ease;
}

#theme-toggle:hover {
    color: #fff; /* Al pasar el mouse se pone blanco */
}
    </style>
</head>

<body>
    <div class="stars" id="stars"></div>
    
    <div class="theme-toggle">
        <button class="theme-btn" id="themeToggle">🌙</button>
    </div>

    <div class="container">
        <header class="header">
            <h1> FINANZAS </h1>
            <p>Conversor de Divisas • Tasas en Tiempo Real • Noticias Financieras</p>
        </header>
        
    
             <nav class="nav-links">
                <a href="{{ url_for('home') }}"> Inicio</a>
                <a href="{{ url_for('contacto') }}"> Contacto</a>
            </nav>
        

        <div class="main-grid">
            <div class="card">
                <h2>Conversor de Divisas</h2>
                <form id="currencyForm" class="converter-form">
                    <div class="input-group">
                        <label for="amount">Monto a Convertir</label>
                        <input type="number" id="amount" placeholder="100" min="0" step="0.01" required>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1fr auto 1fr; gap: 15px; align-items: end;">
                        <div class="input-group">
                            <label for="fromCurrency">De</label>
                            <select id="fromCurrency" required>
                                <option value="">Seleccionar...</option>
                            </select>
                        </div>
                        
                        <button type="button" class="btn btn-secondary" id="swapCurrencies" style="padding: 12px; border-radius: 50%;">⇄</button>
                        
                        <div class="input-group">
                            <label for="toCurrency">A</label>
                            <select id="toCurrency" required>
                                <option value="">Seleccionar...</option>
                            </select>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">
                        Convertir
                    </button>
                </form>

                <div id="result" class="result-card">
                    <div id="resultText"></div>
                </div>
            </div>

            <div class="card">
                <h2>Tasas Principales</h2>
                <div class="rates-grid" id="majorRates">
                    <div class="spinner"></div>
                </div>
                <button class="btn btn-secondary" id="showAllRates" style="margin-top: 20px; width: 100%;">
                    Ver Todas las Tasas
                </button>
            </div>

            <div class="card" id="allRatesSection" style="display: none;">
                <h2>Todas las Tasas de Cambio</h2>
                <div id="allRates" style="max-height: 400px; overflow-y: auto;"></div>
            </div>

            <div class="card news-section">
                <h2>Últimas Noticias Financieras</h2>
                <div class="news-grid" id="newsContainer">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuración
        const FIXER_API_KEY = 'd8a1f13a1838921da6e5552613f1538a';
        const NEWS_API_KEY = 'a59d203e11ef71411494f2ecba624bdd'; 
        const API_URL = `https://data.fixer.io/api/latest?access_key=${FIXER_API_KEY}`;

        const elements = {
            themeToggle: document.getElementById('themeToggle'),
            currencyForm: document.getElementById('currencyForm'),
            fromCurrency: document.getElementById('fromCurrency'),
            toCurrency: document.getElementById('toCurrency'),
            amount: document.getElementById('amount'),
            result: document.getElementById('result'),
            resultText: document.getElementById('resultText'),
            majorRates: document.getElementById('majorRates'),
            showAllRates: document.getElementById('showAllRates'),
            allRatesSection: document.getElementById('allRatesSection'),
            allRates: document.getElementById('allRates'),
            newsContainer: document.getElementById('newsContainer'),
            swapCurrencies: document.getElementById('swapCurrencies')
        };

        const majorCurrencies = ['USD', 'EUR', 'GBP', 'JPY', 'CAD', 'AUD', 'CHF', 'CNY', 'MXN'];


        document.addEventListener('DOMContentLoaded', function() {
            initializeApp();
            createStars();
        });

        async function initializeApp() {
            await loadCurrencies();
            await loadMajorRates();
            await loadFinancialNews();
            setupEventListeners();
        }

        function setupEventListeners() {
            // Toggle tema
            elements.themeToggle.addEventListener('click', toggleTheme);
            
            // Conversor
            elements.currencyForm.addEventListener('submit', handleConversion);
            
            // Mostrar todas las tasas
            elements.showAllRates.addEventListener('click', toggleAllRates);
            
            // Intercambiar divisas
            elements.swapCurrencies.addEventListener('click', swapCurrencies);
        }

//principal
        async function loadCurrencies() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.error.info);
                }

                const currencies = Object.keys(data.rates).sort();
                
                currencies.forEach(currency => {
                    const optionFrom = new Option(currency, currency);
                    const optionTo = new Option(currency, currency);
                    
                    elements.fromCurrency.add(optionFrom);
                    elements.toCurrency.add(optionTo);
                });

                // Valores por defecto
                elements.fromCurrency.value = 'EUR';
                elements.toCurrency.value = 'USD';

            } catch (error) {
                console.error('Error loading currencies:', error);
                showError('Error al cargar las monedas');
            }
        }

        async function handleConversion(event) {
            event.preventDefault();
            
            const fromCurrency = elements.fromCurrency.value;
            const toCurrency = elements.toCurrency.value;
            const amount = parseFloat(elements.amount.value);

            if (!fromCurrency || !toCurrency || !amount) {
                showError('Por favor completa todos los campos');
                return;
            }

            try {
                elements.resultText.innerHTML = '<div class="spinner"></div>';
                elements.result.classList.add('visible');

                const response = await fetch(API_URL);
                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.error.info);
                }

                const fromRate = data.rates[fromCurrency];
                const toRate = data.rates[toCurrency];
                const conversionRate = toRate / fromRate;
                const result = amount * conversionRate;

                elements.resultText.innerHTML = `
                    <div style="font-size: 0.9em; margin-bottom: 10px;">💱 ${fromCurrency} → ${toCurrency}</div>
                    <div style="font-size: 2rem; font-weight: bold; margin: 10px 0;">
                        ${amount} ${fromCurrency} = ${result.toFixed(2)} ${toCurrency}
                    </div>
                    <div style="font-size: 0.9em; color: rgba(255,255,255,0.8);">
                        Tasa: 1 ${fromCurrency} = ${conversionRate.toFixed(6)} ${toCurrency}
                    </div>
                `;

            } catch (error) {
                showError('Error en la conversión: ' + error.message);
            }
        }

        async function loadMajorRates() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.error.info);
                }

                const base = data.base;
                const rates = data.rates;

                elements.majorRates.innerHTML = majorCurrencies.map(currency => `
                    <div class="rate-card">
                        <div>${getCurrencyFlag(currency)} ${currency}</div>
                        <div class="rate-value">${rates[currency] ? rates[currency].toFixed(4) : 'N/A'}</div>
                        <div style="font-size: 0.8em;">vs ${base}</div>
                    </div>
                `).join('');

            } catch (error) {
                elements.majorRates.innerHTML = '<div class="error">Error cargando tasas</div>';
            }
        }

        async function toggleAllRates() {
            if (elements.allRatesSection.style.display === 'none') {
                await loadAllRates();
                elements.allRatesSection.style.display = 'block';
                elements.showAllRates.textContent = '📉 Ocultar Tasas';
            } else {
                elements.allRatesSection.style.display = 'none';
                elements.showAllRates.textContent = '📈 Ver Todas las Tasas';
            }
        }

        async function loadAllRates() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.error.info);
                }

                const rates = data.rates;
                const ratesList = Object.entries(rates)
                    .sort(([a], [b]) => a.localeCompare(b))
                    .map(([currency, rate]) => `
                        <div style="display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid var(--border-color);">
                            <span>${getCurrencyFlag(currency)} ${currency}</span>
                            <span style="font-weight: bold;">${rate.toFixed(6)}</span>
                        </div>
                    `).join('');

                elements.allRates.innerHTML = ratesList;

            } catch (error) {
                elements.allRates.innerHTML = '<div class="error">Error cargando todas las tasas</div>';
            }
        }

        async function loadFinancialNews() {
            try {
                // Usando GNews API como ejemplo
                const newsUrl = `https://gnews.io/api/v4/top-headlines?category=business&lang=es&max=6&token=${NEWS_API_KEY}`;
                const response = await fetch(newsUrl);
                const data = await response.json();

                if (data.articles && data.articles.length > 0) {
                    elements.newsContainer.innerHTML = data.articles.map(article => `
                        <div class="news-card" onclick="window.open('${article.url}', '_blank')">
                            <div class="news-title">${article.title}</div>
                            <div style="font-size: 0.9em; opacity: 0.8; margin-top: 10px;">
                                ${article.description || 'Sin descripción disponible'}
                            </div>
                            <div class="news-source">${article.source.name} • ${new Date(article.publishedAt).toLocaleDateString('es-ES')}</div>
                        </div>
                    `).join('');
                } else {
                    elements.newsContainer.innerHTML = `
                        <div class="news-card">
                            <div class="news-title">Noticias de Mercados</div>
                            <div style="font-size: 0.9em; opacity: 0.8;">
                                Las noticias financieras estarán disponibles aquí.
                            </div>
                        </div>
                    `;
                }
            } catch (error) {
                elements.newsContainer.innerHTML = `
                    <div class="news-card">
                        <div class="news-title">💼 Mercados Globales</div>
                        <div style="font-size: 0.9em; opacity: 0.8;">
                            Sigue las últimas tendencias en los mercados financieros internacionales.
                        </div>
                    </div>
                `;
            }
        }

        function swapCurrencies() {
            const fromValue = elements.fromCurrency.value;
            const toValue = elements.toCurrency.value;
            
            elements.fromCurrency.value = toValue;
            elements.toCurrency.value = fromValue;
            
            // Si hay un resultado visible, reconvertir
            if (elements.result.classList.contains('visible')) {
                elements.currencyForm.dispatchEvent(new Event('submit'));
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            elements.themeToggle.textContent = document.body.classList.contains('light-mode') ? '🌞' : '🌙';
        }

        function getCurrencyFlag(currency) {
            const flags = {
                'USD': '🇺🇸', 'EUR': '🇪🇺', 'GBP': '🇬🇧', 'JPY': '🇯🇵',
                'CAD': '🇨🇦', 'AUD': '🇦🇺', 'CHF': '🇨🇭', 'CNY': '🇨🇳',
                'MXN': '🇲🇽', 'BRL': '🇧🇷', 'ARS': '🇦🇷', 'RUB': '🇷🇺'
            };
            return flags[currency] || '💱';
        }

        function showError(message) {
            elements.resultText.innerHTML = `<div style="color: #ff6b6b;">❌ ${message}</div>`;
            elements.result.classList.add('visible');
        }

        function createStars() {
            const starContainer = document.getElementById('stars');
            const starCount = 200;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                const x = Math.random() * window.innerWidth;
                const y = Math.random() * window.innerHeight;
                const scale = Math.random() * 2;
                const duration = 5 + Math.random() * 10;
                
                star.style.cssText = `
                    left: ${x}px;
                    top: ${y}px;
                    transform: scale(${scale});
                    animation-duration: ${duration}s;
                    animation-delay: ${Math.random() * 10}s;
                `;
                
                starContainer.appendChild(star);
            }
        }
    </script>
</body>
</html>
